name: Build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - '*.md'
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - '*.md'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            TEST_TASK: macosArm64Test
          - os: windows-latest
            TEST_TASK: mingwX64Test
          - os: ubuntu-latest
            TEST_TASK: apiCheck check :test:jvmCompatibilityTest
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          distribution: 'zulu'
          java-version: 11
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ${{matrix.TEST_TASK}} --stacktrace
      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ matrix.os }}
          path: '**/build/reports'

  publish-snapshot:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' && github.repository == 'ajalt/clikt' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Deploy to sonatype
        # disable configuration cache due to https://github.com/gradle/gradle/issues/22779
        run: ./gradlew publishToMavenCentral -PsnapshotVersion=true --no-configuration-cache
    env:
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
