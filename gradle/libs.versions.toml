[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
mordant = "3.1.1"
kotest = "6.2.7"

[libraries]
mordant = {module = "com.github.ajalt.mordant:mordant", version.ref = "mordant"}
mordant-markdown = {module = "com.github.ajalt.mordant:mordant-markdown", version.ref = "mordant"}

# used in tests
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotest = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-table = { module = "io.kotest:kotest-assertions-table", version.ref = "kotest" }
systemrules = "com.github.stefanbirkner:system-rules:1.19.0"
jimfs = "com.google.jimfs:jimfs:1.3.2"

# used in samples
kodein = "org.kodein.di:kodein-di-generic-jvm:6.5.5"
kotlinx-serialization = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0"

[plugins]
dokka = "org.jetbrains.dokka:2.3.0"
publish = "com.vanniktech.maven.publish:0.37.0"
kotlinBinaryCompatibilityValidator = "org.jetbrains.kotlinx.binary-compatibility-validator:0.18.2"
